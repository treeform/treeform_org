<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore Silky's real Nim UI widgets in a WebAssembly demo.">
    <title>Silky widget tour</title>
    <link rel="stylesheet" href="demo.css">
    <script src="demo.js" defer></script>
  </head>
  <body data-demo="basicwindow">
    <canvas id="canvas" tabindex="0" aria-label="Interactive Silky widget tour">
      Your browser needs canvas support to run this demo.
    </canvas>
    <div id="status" class="status" role="status" aria-live="polite">
      <h1 id="status-heading">Loading the widget tour</h1>
      <p id="status-detail">Starting the Silky WebAssembly app…</p>
      <a id="reload" href="basicwindow.html" hidden>Reload demo</a>
    </div>
    <noscript>Enable JavaScript to try the Silky widget tour.</noscript>
  </body>
</html>
